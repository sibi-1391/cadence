<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { width: 360px; min-height: 480px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; background: #0f1117; color: #e2e8f0; display: flex; flex-direction: column; }

    .header { padding: 12px 14px 10px; background: #1a1d27; border-bottom: 1px solid #2d3148; display: flex; align-items: center; justify-content: space-between; }
    .header-left { display: flex; align-items: center; gap: 8px; }
    .logo { font-weight: 700; font-size: 15px; color: #7c6af7; letter-spacing: 1px; }
    .version { font-size: 10px; color: #4a5568; }
    .btn-gear { background: none; border: none; cursor: pointer; color: #4a5568; font-size: 15px; padding: 2px 4px; line-height: 1; }
    .btn-gear:hover { color: #7c6af7; }

    /* Settings panel */
    .settings-panel { background: #13151f; border-bottom: 1px solid #2d3148; padding: 10px 14px; display: none; flex-direction: column; gap: 6px; }
    .settings-panel.open { display: flex; }
    .settings-panel label { font-size: 10px; color: #718096; text-transform: uppercase; letter-spacing: 0.5px; }
    .settings-row { display: flex; gap: 6px; }
    .settings-row input { flex: 1; padding: 6px 9px; background: #0f1117; border: 1px solid #2d3148; border-radius: 6px; color: #e2e8f0; font-size: 12px; outline: none; font-family: monospace; }
    .settings-row input:focus { border-color: #7c6af7; }
    .btn-save { padding: 6px 12px; background: #7c6af7; border: none; border-radius: 6px; color: white; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn-save:hover { background: #6b58e8; }
    .key-status { font-size: 10px; margin-left: 4px; }
    .key-status.set { color: #48bb78; }
    .key-status.unset { color: #fc8181; }

    .dag-bar { padding: 7px 14px; background: #13151f; border-bottom: 1px solid #2d3148; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .dag-info { font-size: 11px; color: #718096; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .dag-info span { color: #7c6af7; }
    .btn-import { font-size: 11px; padding: 3px 10px; border-radius: 4px; border: 1px solid #7c6af7; background: transparent; color: #7c6af7; cursor: pointer; white-space: nowrap; }
    .btn-import:hover { background: #7c6af720; }

    .page-ctx { padding: 5px 14px; background: #0f1117; border-bottom: 1px solid #1e2235; font-size: 10px; color: #4a5568; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .page-ctx span { color: #48bb78; }

    .messages { flex: 1; overflow-y: auto; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; min-height: 260px; max-height: 290px; }
    .msg { display: flex; flex-direction: column; gap: 2px; max-width: 90%; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.agent { align-self: flex-start; align-items: flex-start; }
    .bubble { padding: 8px 11px; border-radius: 10px; line-height: 1.5; word-break: break-word; }
    .msg.user .bubble { background: #7c6af720; border: 1px solid #7c6af740; color: #c3b8ff; border-radius: 10px 10px 2px 10px; }
    .msg.agent .bubble { background: #1a1d27; border: 1px solid #2d3148; color: #e2e8f0; border-radius: 10px 10px 10px 2px; }
    .msg.agent.error .bubble { border-color: #fc8181; color: #fc8181; }
    .msg-time { font-size: 10px; color: #4a5568; }

    .steps { font-size: 11px; color: #718096; padding: 6px 10px; background: #13151f; border: 1px solid #2d3148; border-radius: 6px; margin-top: 4px; width: 100%; }
    .steps div { padding: 1px 0; }
    .steps .done { color: #48bb78; }
    .steps .active { color: #f6ad55; }

    .input-area { padding: 10px 14px 12px; background: #1a1d27; border-top: 1px solid #2d3148; display: flex; gap: 8px; }
    .input-area input { flex: 1; padding: 8px 11px; background: #0f1117; border: 1px solid #2d3148; border-radius: 7px; color: #e2e8f0; font-size: 13px; outline: none; }
    .input-area input:focus { border-color: #7c6af7; }
    .input-area input::placeholder { color: #4a5568; }
    .btn-send { padding: 8px 14px; background: #7c6af7; border: none; border-radius: 7px; color: white; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-send:hover { background: #6b58e8; }
    .btn-send:disabled { background: #2d3148; cursor: default; }

    #fileInput { display: none; }
    .messages::-webkit-scrollbar { width: 4px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: #2d3148; border-radius: 2px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-left">
      <span class="logo">CADENCE</span>
      <span class="version">v0.1</span>
    </div>
    <button class="btn-gear" id="btnGear" title="Settings">⚙</button>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <label>Anthropic API Key <span class="key-status" id="keyStatus"></span></label>
    <div class="settings-row">
      <input type="password" id="apiKeyInput" placeholder="sk-ant-..." />
      <button class="btn-save" id="btnSaveKey">Save</button>
    </div>
  </div>

  <div class="dag-bar">
    <span class="dag-info" id="dagInfo">No DAG loaded</span>
    <button class="btn-import" id="btnImport">Import DAG</button>
    <input type="file" id="fileInput" accept=".json" />
  </div>

  <div class="page-ctx" id="pageCtx">Current page: detecting...</div>

  <div class="messages" id="messages">
    <div class="msg agent">
      <div class="bubble">Hi! Import a <strong>cadence_dag.json</strong> and I'll navigate this page for you.</div>
      <span class="msg-time">now</span>
    </div>
  </div>

  <div class="input-area">
    <input type="text" id="queryInput" placeholder="Ask me to do something on this page..." />
    <button class="btn-send" id="btnSend" disabled>→</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
